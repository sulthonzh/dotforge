name: Release

on:
  release:
    types:
      - created
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run basic tests
        run: |
          echo "Testing action.yml..."
          python -c "
          import yaml
          import sys
          
          # Validate action.yml
          with open('action.yml', 'r') as f:
            action = yaml.safe_load(f)
          
          # Check required fields
          required_fields = ['name', 'description', 'runs', 'branding']
          for field in required_fields:
            if field not in action:
              print(f'Error: Missing required field {field}')
              sys.exit(1)
          
          # Check Docker configuration
          runs = action['runs']
          if runs.get('using') != 'docker':
            print('Error: runs.using must be docker')
            sys.exit(1)
          
          if 'image' not in runs:
            print('Error: runs.image is required')
            sys.exit(1)
          
          print('✅ action.yml validation passed')
          "

  build:
    # 2026-08-17: no DOCKER_HUB_* secrets (fleet-wide ENEEDAUTH) — gate instead of failing every push (set DOCKER_PUBLISH_ENABLED=true + secrets to re-enable)
    if: ${{ vars.DOCKER_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: sulthonzh/dotforge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max